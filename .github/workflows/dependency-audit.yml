name: Dependency Security Audit

on:
  schedule:
    # Every Monday at 09:10 JST (00:10 UTC); staggered across CircleNote tools
    - cron: '10 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    name: npm audit (weekly)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit (fail on moderate or higher)
        run: |
          set +e
          npm audit --json > audit-result.json
          AUDIT_EXIT=$?
          set -e

          AUDIT_EXIT="$AUDIT_EXIT" node ./scripts/dependency-audit.mjs audit audit-result.json

      - name: Check outdated packages (informational only)
        if: always()
        run: |
          set +e
          npm outdated --json > outdated-result.json
          OUTDATED_EXIT=$?
          set -e

          OUTDATED_EXIT="$OUTDATED_EXIT" node ./scripts/dependency-audit.mjs outdated outdated-result.json
