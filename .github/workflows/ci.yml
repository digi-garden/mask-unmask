name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - integration/mu-compliance-acceptance

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Type check, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Check production browser verification script syntax
        run: node --check scripts/verify-production-browser.mjs && node --check scripts/verify-production-oss.mjs && node --check scripts/verify-recovery-candidates.mjs && node --check scripts/scan-dist-secrets.mjs

      - name: Run tests
        run: npm run test

      - name: Run performance test
        run: npm run test:perf

      - name: Audit production dependencies (high and critical)
        run: npm run audit:production-deps

      - name: Audit OSS lockfile metadata
        run: npm run audit:oss

      - name: Build
        run: npm run build

      - name: Prepare and verify standalone Pages distribution
        run: node scripts/build-standalone.mjs && node scripts/verify-standalone.mjs

      - name: Inventory built distribution and license evidence
        run: npm run audit:distribution

      - name: Scan built distribution for credential signatures
        run: npm run scan:dist:secrets

      - name: Preserve inspected release distribution
        uses: actions/upload-artifact@v4
        with:
          name: mask-unmask-dist-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  e2e:
    name: End-to-end test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: "true"
